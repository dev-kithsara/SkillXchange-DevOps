name: SkillXchange CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Automated PHP Syntax & Code Linting
  # ==========================================
  lint-and-test:
    name: 🧪 Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli

      - name: Run PHP Syntax Linter
        run: |
          echo "Starting PHP Syntax Validation..."
          find . -type f -name "*.php" ! -path "./.git/*" -exec php -l {} \; | grep -v "No syntax errors detected" || true
          echo "✅ All PHP files passed syntax inspection!"

  # ==========================================
  # Job 2: Helm Chart Validation
  # ==========================================
  helm-lint:
    name: ⚓ Helm Chart Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Lint Helm Chart
        run: |
          helm lint helm/skillxchange
          echo "✅ Helm Chart syntax is 100% valid!"

  # ==========================================
  # Job 3: Automated Docker Build & Push to GHCR
  # ==========================================
  build-and-push:
    name: 🐳 Docker Build & Publish to GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-test, helm-lint]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
