kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: skillxchange-cluster
nodes:
  # 1. Control Plane (Master Node) with Ingress Port Mappings
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 9090
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP

  # 2. Worker Node 1
  - role: worker

  # 3. Worker Node 2
  - role: worker