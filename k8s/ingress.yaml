apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillxchange-ingress
  namespace: skillxchange
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillxchange-web
                port:
                  number: 80