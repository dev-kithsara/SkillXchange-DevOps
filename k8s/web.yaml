# 1. Service
apiVersion: v1
kind: Service
metadata:
  name: skillxchange-web
  namespace: skillxchange
  labels:
    app: skillxchange
    tier: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: skillxchange
    tier: frontend
---
# 2. Web Deployment with Shared Assets (initContainer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillxchange-web
  namespace: skillxchange
  labels:
    app: skillxchange
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillxchange
      tier: frontend
  template:
    metadata:
      labels:
        app: skillxchange
        tier: frontend
    spec:
      # Init Container: Copies all web assets into the shared volume before app starts
      initContainers:
        - name: copy-assets
          image: skillxchange-app:latest
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'cp -r /var/www/html/. /shared-code/']
          volumeMounts:
            - name: code-volume
              mountPath: /shared-code

      containers:
        # Container 1: NGINX Web Server (Serves static CSS/JS/Images & proxies PHP)
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: code-volume
              mountPath: /var/www/html
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

        # Container 2: PHP-FPM Backend
        - name: app
          image: skillxchange-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: fastcgi
          envFrom:
            - configMapRef:
                name: skillxchange-config
            - secretRef:
                name: skillxchange-secrets
          volumeMounts:
            - name: code-volume
              mountPath: /var/www/html
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15

      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: code-volume
          emptyDir: {}